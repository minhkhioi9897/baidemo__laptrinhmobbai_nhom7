name: voicehub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.2
  speech_to_text: ^7.3.0
  record: 5.1.2
  record_platform_interface: 1.1.0
  just_audio: ^0.9.46
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  path: ^1.9.0
  math_expressions: ^2.6.0
  connectivity_plus: ^6.1.3
  google_generative_ai: ^0.4.6
  sqflite: ^2.4.1
  app_links: ^6.3.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_database: ^11.3.1
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
